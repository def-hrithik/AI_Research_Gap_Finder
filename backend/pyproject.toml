[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests that load real ML models (deselect with '-m \"not slow\"')",
    "integration: marks tests that need Qdrant/LLM (deselect with '-m \"not integration\"')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.pyrefly]
python_version = "3.11"
search_path = ["."]
# Ignore third-party libraries without type stubs
ignore_missing_imports = true

